# Doctbase runtime sockets.
# Installed by the Doctbase installer; do not edit.
# Recreated on boot because /run is a tmpfs. Sockets are 0660 service:doctbase.
d /run/doctbase 0770 root doctbase -
# PgBouncer names its Unix socket .s.PGSQL.6432; keep the documented stable
# client path pointing at it.
L /run/doctbase/pgbouncer.sock - - - - .s.PGSQL.6432
