          type: boolean
          default: false
        encrypt:
          type: boolean
          default: false

    BackupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Backup"

    RestoreRequest:
      type: object
      required: [confirm]
