# Generated by the Doctbase native installer. DO NOT EDIT.
# Source template: infrastructure/postgres/tuning.conf
# Apply: sudo doctbase apply
#
# This is a conf.d drop-in for the dedicated PostgreSQL cluster
# (`doctbase`, port 5433). It never enables TCP: PostgreSQL is reachable only
# over the local Unix socket, and applications connect through PgBouncer.
#
# Sizing is derived from host RAM and `database.max_connections` so a fresh
# 2 vCPU / 2 GB VPS gets safe values without a manual edit.

listen_addresses = ''
port = 5433
unix_socket_directories = '/var/run/postgresql'
password_encryption = 'scram-sha-256'
ssl = off

max_connections = @MAX_CONNECTIONS@
shared_buffers = '@SHARED_BUFFERS@'
effective_cache_size = '@EFFECTIVE_CACHE_SIZE@'
maintenance_work_mem = '@MAINTENANCE_WORK_MEM@'
work_mem = '@WORK_MEM@'

# Used by `doctor` and capacity reporting; preloaded so the extension works in
# the template database.
shared_preload_libraries = 'pg_stat_statements'

# Journald owns retention; keep PostgreSQL from writing its own log files.
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 1000
